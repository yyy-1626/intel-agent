[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intel-agent"
version = "0.1.0"
description = "威胁情报抽取 Agent — 从安全报告中提取结构化情报"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Intel Agent Team"}
]
keywords = ["threat-intelligence", "cybersecurity", "llm", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "pydantic>=2.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "requests>=2.31",
    "readability-lxml>=0.8.1",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "tenacity>=8.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11"]
youtube = ["yt-dlp>=2024"]
office = ["python-docx>=1.0", "openpyxl>=3.1", "python-pptx>=0.6"]
playwright = ["playwright>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
intel-agent = "intel_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"intel_agent" = "src/intel_agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]